<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trial</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 p-0 bg-[#f0f0f0]">

    <div class="relative mx-auto">
        <div class="relative hidden lg:flex">   <!-- desktop version -->
            <div class="h-[90vw]">               <!-- overall scroll distance of the group -->

                <!-- Pink -->
                <div class="absolute top-0 left-0 h-[90vw] w-full">
                    <img src="Pink.png" 
                         class="sticky h-[45vw] w-auto top-[-1.5vw] left-[35vw]"
                         style="max-width: none;">
                </div>
                <!-- Yellow (pins first) -->
                <div class="absolute top-0 left-0 h-[90vw] w-full">
                    <img src="YellowLg.png" 
                         class="sticky h-[68vw] w-auto top-0 left-0"
                         style="max-width: none;">
                </div>

                <!-- Blue -->
                <div class="absolute top-0 left-0 h-[100vw] w-full">
                    <img src="Blue.png" 
                         class="sticky h-[55vw] w-auto top-[-5vw] left-[36vw]"
                         style="max-width: none;">
                </div>

                <!-- smallgreen -->
                <div class="absolute top-0 left-0 h-[95vw] w-full">
                    <img src="smallgreen.png" 
                         class="sticky h-[48vw] w-auto top-[-8vw] left-[20vw]"
                         style="max-width: none;">
                </div>

                <!-- greenSide (right side) -->
                <div class="absolute top-0 left-0 h-[100vw] w-full">
                    <img src="greenSide.png" 
                         class="sticky h-[70vw] w-auto top-[-6vw] right-0"
                         style="max-width: none;">
                </div>

                <!-- Red (pins last) -->
                <div class="absolute top-0 left-0 h-[110vw] w-full">
                    <img src="Red.png" 
                         class="sticky h-[40vw] w-auto top-[-28vw] left-[12vw]"
                         style="max-width: none;">
                </div>

            </div>
        </div>
    </div>

    <!-- Content that appears after the shapes leave -->
    <div class="px-20 py-40 max-w-4xl mx-auto text-3xl leading-relaxed">
        <p>We are a Berlin-based communications agency…</p>
    </div>

</body>
</html>
