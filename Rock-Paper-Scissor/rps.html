<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="rps.css">
    <title>Rock Paper Scissor</title>
</head>
<body>
 <h1 id="ccc">Rock Paper Scissor</h1> 
 <!--Mode Selection-->
 <section class="mode-selection">
  <h2>Select Game Mode:</h2>
  <label><input type="radio" name="mode" value="player-vs-player"> Player vs Player</label>
  <label><input type="radio" name="mode" value="player-vs-computer"> Player vs Computer</label>
</section>

<section class="player-one">
  <h2>Player 1 Choice:</h2>
  <button>Rock</button>
  <button>Paper</button>
  <button>Scissor</button>
</section>

<section class="player-two">
  <h2>Player 2 / Computer Choice:</h2>
  <button>Rock</button>
  <button>Paper</button>
  <button>Scissor</button>
</section>

<section class="game-result">
  <h2>Result:</h2>
  <p>Player 1:</p>
  <p>Player 2 / Computer:</p>
  <p>Outcome:</p>
</section>
<script>src="rps.js"</script>
